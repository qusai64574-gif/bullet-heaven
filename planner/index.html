<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="description" content="Study Planner — homework, projects, exams, events and deadlines in one place. Works offline.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Planner">
<meta name="format-detection" content="telephone=no">
<title>Study Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/auth.css">
<script>
/* Apply the saved theme before first paint so there is never a flash of the
   wrong theme. Kept inline and dependency-free on purpose. */
(function () {
  try {
    var raw = null;
    // The active document is the signed-in account's, else the guest one.
    var session = null;
    try { session = JSON.parse(localStorage.getItem('studyplanner.session.v1') || 'null'); } catch (e) {}
    var keys = [];
    if (session && session.accountId) keys.push('studyplanner.db.v1.acct.' + session.accountId);
    keys.push('studyplanner.db.v1');
    for (var i = 0; i < keys.length && !raw; i++) raw = localStorage.getItem(keys[i]);
    var mode = 'system';
    if (raw) {
      var doc = JSON.parse(raw);
      if (doc && doc.settings && doc.settings.theme) mode = doc.settings.theme;
    }
    var resolved = mode;
    if (mode === 'system') {
      resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', resolved);
    document.documentElement.setAttribute('data-theme-mode', mode);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', resolved === 'dark' ? '#212121' : '#ffffff');
  } catch (e) {
    /* Storage unavailable — fall back to the system preference silently. */
  }
})();
</script>
</head>
<body>

<div id="app">
  <!-- First-paint skeleton: replaced the moment the app boots. Gives instant
       feedback on slow devices instead of a blank screen. -->
  <div class="boot" id="boot">
    <div class="boot__inner">
      <div class="boot__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 8.5 12 4l9.5 4.5L12 13z"></path>
          <path d="M6 10.5V16c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6v-5.5"></path>
        </svg>
      </div>
      <div class="boot__title">Study Planner</div>
      <div class="boot__sub">Loading your work…</div>
      <div class="boot__bar" aria-hidden="true"><i></i></div>
    </div>
  </div>
</div>

<noscript>
  <div style="padding:32px;font-family:system-ui,sans-serif;line-height:1.6">
    <h1 style="font-size:20px">JavaScript is required</h1>
    <p>Study Planner runs entirely on your device and needs JavaScript enabled to store and show your work.</p>
  </div>
</noscript>

<style>
/* Boot screen styles live here so they apply before the stylesheets finish. */
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg-canvas,#fff);z-index:200;animation:boot-out .28s ease-out .12s forwards}
html[data-theme="dark"] .boot{background:#212121}
.boot__inner{text-align:center;padding:24px;animation:screen-in .3s ease-out both}
.boot__mark{width:56px;height:56px;border-radius:18px;background:var(--accent,#0d0d0d);color:#fff;display:grid;place-items:center;margin:0 auto 16px}
html[data-theme="dark"] .boot__mark{background:#fff;color:#0d0d0d}
.boot__title{font-family:system-ui,-apple-system,sans-serif;font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--text-primary,#0d0d0d)}
html[data-theme="dark"] .boot__title{color:#ececec}
.boot__sub{font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:#8f8f8f;margin-top:6px}
.boot__bar{width:120px;height:3px;border-radius:99px;background:rgba(128,128,128,.18);margin:20px auto 0;overflow:hidden}
.boot__bar i{display:block;height:100%;width:40%;border-radius:99px;background:#8f8f8f;animation:boot-slide 1.1s ease-in-out infinite}
@keyframes boot-slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
@keyframes boot-out{to{opacity:0;visibility:hidden}}
@keyframes screen-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.boot__bar i{animation:none;width:100%}.boot{animation-delay:0s}}
</style>

<!-- Core -->
<script src="js/core/utils.js"></script>
<script src="js/core/idb.js"></script>
<script src="js/core/models.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/auth.js"></script>
<!-- UI kit -->
<script src="js/ui/ui.js"></script>
<!-- Domain -->
<script src="js/core/notify.js"></script>
<script src="js/domain/planner.js"></script>
<script src="js/domain/search.js"></script>
<script src="js/domain/assistant.js"></script>
<script src="js/data/sample.js"></script>
<!-- Shell -->
<script src="js/ui/router.js"></script>
<!-- Screens -->
<script src="js/screens/auth.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/calendar.js"></script>
<script src="js/screens/lists.js"></script>
<script src="js/screens/projects.js"></script>
<script src="js/screens/detail.js"></script>
<script src="js/screens/more.js"></script>
<script src="js/screens/assistant.js"></script>
<script src="js/screens/onboarding.js"></script>
<!-- Boot -->
<script src="js/app.js"></script>
<script>
/* Remove the boot skeleton as soon as the app has taken over the DOM. */
(function () {
  function clearBoot() {
    var b = document.getElementById('boot');
    if (b && document.getElementById('app').children.length > 1) {
      b.remove();
    } else if (b) {
      setTimeout(clearBoot, 120);
    }
  }
  clearBoot();
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b) b.remove();
  }, 4000);
})();
</script>
</body>
</html>
